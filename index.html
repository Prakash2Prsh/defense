 panel();lst();
}
function pick(id,tog){if(tog&&sel==id&&N[id].k.length)N[id].open=!N[id].open;else if(tog&&N[id].k.length)N[id].open=true;sel=id;cur=id;CHs=null;HP=new Set();render();const g=document.querySelector(`.nd[data-id="${id}"] rect`);g&&g.scrollIntoView({block:'center',inline:'center'})}
function rel(id){return E.filter(e=>e.s==id||e.t==id)}
function panel(){const n=N[sel],c=CL[n.c],par=N[n.p],rs=rel(sel);
 $('#pn').innerHTML=`<div style="color:var(--mu);font-size:10px">${path(sel)}</div><div style="font-size:15px;font-weight:600">${n.name}</div><span class="tag" style="color:${c[1]}">${c[0]}</span><span class="tag">${n.type}</span><span class="tag">${n.svc}</span>
 <span class="k">ROLE</span>${n.role}${n.loc?`<span class="k">LOCATION</span>${n.loc}`:''}
 <span class="k">PARENT / RELATION TO PARENT</span>${par?`${par.name} (${RC[n.rel]})`:'—'}
 <span class="k">FUNCTIONS</span>${n.fn||'—'}
 <span class="k">DOWNSTREAM (${n.k.length})</span>${n.k.map(k=>N[k].name).join(', ')||'—'}
 <span class="k">PROCUREMENT / TECHNICAL / END-USER ROLES</span>${rs.length?rs.map(e=>{const o=N[e.s==sel?e.t:e.s],t=TY[e.ty];return `<div class="rl" onclick="pick('${o.id}',false);reveal('${o.id}');render()" style="color:${t.c}">${t.g} ${e.s==sel?'→':'←'} ${e.ty} · <span style="color:var(--tx)">${o.name}</span> <small>[${e.c}] ${e.d}</small></div>`}).join(''):'Public information insufficient.'}
 <span class="k">SOURCE</span><a href="${SRC[n.src][1]}" target="_blank" rel="noopener">${SRC[n.src][0]}</a> (institutional homepage)
 <span class="k">LAST VERIFIED</span>Compiled from knowledge to mid-2026; not live re-verified
 <div style="margin-top:10px">${[['UPSTREAM','up'],['DOWNSTREAM','dn'],['COMMAND CHAIN','cmd'],['PROCUREMENT CHAIN','proc'],['TECHNICAL CHAIN','tech'],['END-USER CHAIN','eu'],['RELATED ORGS','all']].map(b=>`<button class="btn" onclick="chain('${b[1]}')">SHOW ${b[0]}</button>`).join(' ')}</div>`}
function chain(k){const n=N[sel];HP=new Set();CHs=null;
 if(k=='up'){let m=n;while(m){HP.add(m.id);m=N[m.p]}reveal(sel)}
 else if(k=='dn'){n.open=true;n.k.forEach(x=>N[x].open=true)}
 else{CHs=k=='all'?null:CH[k];rel(sel).filter(e=>!CHs||CHs.includes(e.ty)).forEach(e=>reveal(e.s==sel?e.t:e.s))}
 render()}
function lst(){const n=N[cur];$('#list').innerHTML=`<div style="color:var(--mu);margin:6px 0">${path(cur)}</div>`+(n.p?`<button class="btn" onclick="cur='${n.p}';sel=cur;render()">↑ UP</button>`:'')+n.k.map(k=>`<div class="rl" onclick="cur='${k}';sel='${k}';render()" style="padding:8px"><span style="color:${CL[N[k].c][1]}">●</span> ${N[k].name} ${N[k].k.length?'›':''}</div>`).join('')}
function focus(id){Object.values(N).forEach(n=>n.open=false);N.IDE.open=true;reveal(id);N[id].open=true;sel=id;cur=id;CHs=null;HP=new Set();show('app');render()}
const NAVI=[['OVERVIEW','IDE'],['COMMAND','MOD'],['ARMY','ARMY'],['NAVY','NAVY'],['AIR FORCE','IAF'],['JOINT','JNT'],['STRATEGIC','STR'],['R&D','RD'],['ACQUISITION','ACQ'],['PRODUCTION','PROD'],['TESTING','TEST'],['LOGISTICS','LOG'],['TRAINING','TRN'],['INDUSTRY','IND'],['SUPPLIER NAVIGATOR','pg:nav'],['SOURCES','pg:src'],['ABOUT / METHOD','pg:abt']];
$('#nav').innerHTML=NAVI.map((n,i)=>`<button data-i="${i}">${n[0]}</button>`).join('');
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;const t=NAVI[b.dataset.i][1];document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
 if(t.startsWith('pg:'))page(t.slice(3));else{focus(t);if(t=='ACQ')page('acq',true)}}
function show(w){$('#app').style.display=w=='app'?'':'none';$('#list').style.display=w=='app'&&innerWidth<=800?'block':'none';$('#doc').style.display=w=='doc'?'block':'none'}
const PIPE=[['Capability gap & planning','Service HQ; HQ IDS (joint perspective)','—','DAC (plans)','Service'],['Acceptance of Necessity','Service HQ proposal','Acquisition Wing + Integrated Finance','DAC','—'],['RFI / RFP','Service HQ specifies (staff requirements)','—','Acquisition Wing issues','—'],['Technical evaluation & trials','Service HQ specifies parameters','Technical evaluation committee; Service trial units; DRDO / test ranges','—','Service users in trials'],['Staff evaluation','Service HQ','Service staff evaluation','—','Service'],['Commercial evaluation & negotiation','—','Acquisition Wing + Finance','CNC negotiates','—'],['Approval','—','Finance vetting','Competent Financial Authority by value (RM / FM / CCS)','—'],['Contract','—','—','MoD Acquisition Wing signs','—'],['Production, QA & acceptance','—','DGQA / DGAQA; CEMILAC (airworthiness); Service overseeing teams','Manufacturer (DPSU / private) delivers','Service accepts after inspection'],['Induction & lifecycle','—','—','—','Service operates; Army AOC/EME, Navy dockyards, IAF Maintenance Command sustain']];
function page(p,keep){show('doc');let h='';
 if(p=='acq')h=`<h2>ACQUISITION PATHWAY</h2><table><tr><th>Stage</th><th>Generates / specifies</th><th>Evaluates / tests</th><th>Approves / contracts / negotiates</th><th>Accepts / uses</th></tr>${PIPE.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')}</table><p style="color:var(--mu)">Generalised from public Defence Acquisition Procedure descriptions; procedure editions and thresholds change. Check current MoD documents.</p><button class="btn" onclick="show('app')">OPEN IN GRAPH</button>`;
 if(p=='nav')h=`<h2>WHERE DO I GO? · CAPABILITY → ORGANISATION</h2><p style="color:var(--mu)">PUBLIC-DOMAIN ORGANISATIONAL NAVIGATION, derived from graph edges. Not an official procurement route.</p><input id="cq" placeholder="What do you make or supply? e.g. radar, drone, uniform" style="width:100%;max-width:520px;background:var(--pn);color:var(--tx);border:1px solid var(--ln);padding:8px"><div>${Object.values(N).filter(n=>n.type=='Capability').map(n=>`<span class="ch" onclick="cap('${n.id}')">${n.name}</span>`).join('')}</div><div id="co"></div>`;
 if(p=='src')h=`<h2>SOURCES</h2><p>Tier 1 official (institutional pointers; access dates not recorded in this build):</p><ul>${Object.values(SRC).map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a> — ${s[1]}</li>`).join('')}<li><a href="https://cag.gov.in" target="_blank" rel="noopener">CAG</a></li><li><a href="https://sansad.in" target="_blank" rel="noopener">Parliament / Standing Committee on Defence</a> (Tier 2)</li></ul><p style="color:var(--mu)">Per-claim source records (title, date, access date, evidence type) are not yet populated; each node links to its institutional source only.</p>`;
 if(p=='abt')h=`<h2>ABOUT / METHODOLOGY</h2><p>Purpose: locate a capability inside India's defence system. Command, administration, procurement, technical, testing, quality and certification are modelled as separate relationship types, not one chain. No office-holder names, contacts or classified detail are included.</p><p><b>Confidence:</b> ${Object.values(CL).map(c=>`<span class="tag" style="color:${c[1]}">${c[0]}</span>`).join(' ')}</p><p><b>Limits:</b> compiled from the author's knowledge to mid-2026 without live source checks. Structures, DAP editions, thresholds and DRDO cluster mappings change. Nothing here is live re-verified: PUBLICLY DOCUMENTED means consistent with long-standing public record, not checked against a current source. Unknown items say: Public information insufficient. Historical (pre-2021 OFB) structures are not shown. Authority filter and full per-claim source records are not implemented in this version.</p>`;
 $('#doc').innerHTML=h;if(p=='nav')navInit()}
const ROLES=[['USES','End user'],['GENERATES_REQUIREMENT','Requirement owner'],['SPECIFIES','Specification'],['TECHNICALLY_CONTROLS','Technical authority'],['PROCURES_FOR','Procurement authority'],['DEVELOPS','Developer'],['TESTS','Testing'],['INSPECTS','Inspection / QA'],['CERTIFIES','Certification'],['MANUFACTURES','Manufacturer'],['ACCEPTS','Acceptance'],['MAINTAINS','Maintenance']];
function navInit(){const o=Object.values(N).filter(n=>n.type=='Capability');$('#cq').oninput=e=>{const v=e.target.value.toLowerCase().trim();const m=o.find(n=>v&&(n.name+' '+n.role).toLowerCase().includes(v));m?cap(m.id):$('#co').innerHTML=v?'<p style="color:var(--r)">Public information insufficient: no capability node matches.</p>':''}}
function cap(id){const n=N[id];$('#co').innerHTML=`<h3>${n.name}</h3><table>`+ROLES.map(r=>{const l=E.filter(e=>e.t==id&&e.ty==r[0]);return `<tr><th>${r[1]}<br><small>${r[0]}</small></th><td>${l.length?l.map(e=>`<span class="ch" onclick="focus('${e.s}')">${N[e.s].name}</span>`).join(''):'<span style="color:var(--r)">Public information insufficient</span>'}</td></tr>`}).join('')+`</table>`}
let Z=1;function zoom(d){Z=Math.max(.4,Math.min(1.6,Z+d));$('#svg').style.zoom=Z}
const q=$('#q'),rs=$('#res');
q.oninput=()=>{const v=q.value.toLowerCase().trim();if(!v){rs.style.display='none';return}
 const m=Object.values(N).filter(n=>(n.name+' '+n.role+' '+n.fn+' '+n.type).toLowerCase().includes(v)).slice(0,8);
 rs.style.display='block';rs.innerHTML=m.map(n=>{const r=rel(n.id).filter(e=>e.t==n.id).map(e=>e.ty+': '+N[e.s].name).join(' · ');return `<div data-id="${n.id}"><b>${n.name}</b><br><small style="color:var(--mu)">Sits: ${path(n.id)}${r?'<br>'+r:''}</small></div>`}).join('')||'<div>Public information insufficient.</div>'};
rs.onclick=e=>{const d=e.target.closest('[data-id]');if(!d)return;rs.style.display='none';reveal(d.dataset.id);show('app');pick(d.dataset.id,false)};
render();
</script></body></html>
